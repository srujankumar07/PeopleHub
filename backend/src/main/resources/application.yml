spring:
  application:
    name: peoplehub

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/peoplehub}
    username: ${DB_USER:peoplehub}
    password: ${DB_PASSWORD:peoplehub}
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false          # no lazy loading in controllers: forces clean service/DTO boundaries
    hibernate:
      ddl-auto: validate         # Flyway owns the schema, Hibernate only checks that entities match it

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "peoplehub::"
      use-key-prefix: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

peoplehub:
  seed:
    enabled: false               # switched on by the "seed" profile, see application-seed.yml
