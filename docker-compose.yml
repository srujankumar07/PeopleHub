services:
  postgres:
    image: postgres:16-alpine
    container_name: peoplehub-postgres
    environment:
      POSTGRES_DB: peoplehub
      POSTGRES_USER: peoplehub
      POSTGRES_PASSWORD: peoplehub
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peoplehub -d peoplehub"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: peoplehub-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
